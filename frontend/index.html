<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Audio Analytics | Рабочее пространство</title>
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2b3674;
            --text-muted: #a3aed1;
            --primary: #4318ff;
            --danger: #e0282e;
            --danger-bg: #ffe5e5;
            --success: #05cd99;
            --success-bg: #e5fbf5;
            --border: #e2e8f0;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }

        /* Верхнее меню (Tabs) */
        .navbar { background: var(--card-bg); padding: 15px 50px; display: flex; gap: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 30px; }
        .tab-btn { font-size: 16px; font-weight: 600; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 10px 5px; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-btn:hover { color: var(--primary); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .container { padding: 0 50px 50px 50px; }
        h1 { font-size: 28px; margin-bottom: 20px; font-weight: 700; margin-top: 0; }

        /* Вкладки (Скрываем/Показываем) */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Элементы управления */
        .filter-panel { background: var(--card-bg); padding: 20px; border-radius: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .filter-group { display: flex; align-items: center; gap: 15px; }
        .filter-label { font-weight: 600; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-quick { padding: 8px 16px; border: 1px solid var(--border); background: transparent; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-main); transition: 0.2s; outline: none;}
        .btn-quick:hover { background: #f0f2f5; }
        .btn-quick.active { background: var(--primary); color: white; border-color: var(--primary); }

        input[type="date"], input[type="text"], select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; color: var(--text-main); outline: none; }

        .toggle-container { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }

        /* Карточки */
        .dashboard { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 16px; flex: 1; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .card-title { color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; margin-bottom: 10px; }
        .card-value { font-size: 36px; font-weight: 700; }
        .val-red { color: var(--danger); }

        /* Таблица */
        .table-container { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 13px; text-transform: uppercase; font-weight: 600; border-bottom: 2px solid var(--border); }
        td { font-size: 15px; font-weight: 500; }

        /* Бейджи и Кнопки действий */
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .badge-success { background: var(--success-bg); color: var(--success); }
        .badge-danger { background: var(--danger-bg); color: var(--danger); }
        .violation-tag { display: inline-block; background: var(--danger); color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 6px; margin-right: 4px; }

        .btn-delete { background: var(--danger-bg); color: var(--danger); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-delete:hover { background: var(--danger); color: white; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add:hover { background: #3211c4; }

        audio { height: 32px; outline: none; }
    </style>
</head>
<body>

    <!-- Навигация -->
    <div class="navbar">
        <button class="tab-btn active" onclick="switchTab('dashboard', this)">Аналитика смен</button>
        <button class="tab-btn" onclick="switchTab('employees', this)">Сотрудники</button>
    </div>

    <div class="container">

        <!-- ВКЛАДКА 1: ДАШБОРД -->
        <div id="tab-dashboard" class="tab-content active">
            <h1>Контроль качества</h1>

            <div class="filter-panel">
                <div class="filter-group">
                    <span class="filter-label">Период:</span>
                    <button class="btn-quick active" id="btn-today" onclick="setDate('today')">Сегодня</button>
                    <button class="btn-quick" id="btn-yesterday" onclick="setDate('yesterday')">Вчера</button>
                    <input type="date" id="date-select" onchange="onCustomDateSelect()">
                </div>

                <div class="filter-group">
                    <select id="emp-select" class="btn-quick" style="background: white;" onchange="loadData()">
                        <option value="">Все администраторы</option>
                    </select>
                </div>

                <label class="toggle-container">
                    <input type="checkbox" id="filter-violations" onchange="renderTable()">
                    Только нарушения
                </label>
            </div>

            <div class="dashboard">
                <div class="card">
                    <div class="card-title">Всего диалогов</div>
                    <div class="card-value" id="val-total">0</div>
                </div>
                <div class="card">
                    <div class="card-title">Процент негатива</div>
                    <div class="card-value" id="val-negative">0%</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Сотрудник</th>
                            <th>Время</th>
                            <th>Статус</th>
                            <th>Распознанный текст</th>
                            <th>Аудио</th>
                        </tr>
                    </thead>
                    <tbody id="dialogs-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- ВКЛАДКА 2: СОТРУДНИКИ -->
        <div id="tab-employees" class="tab-content">
            <h1>Управление персоналом</h1>

            <div class="filter-panel">
                <div class="filter-group">
                    <input type="text" id="new-emp-name" placeholder="Имя нового администратора..." style="width: 300px;">
                    <button class="btn-add" onclick="addEmployee()">+ Добавить</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID в системе</th>
                            <th>Имя сотрудника</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="emp-tbody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const clubId = 1;
        let currentDialogs = [];

        // Инициализация при загрузке
        window.onload = async () => {
            await fetchEmployees();
            setDate('today');
        };

        // Логика переключения вкладок
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById('tab-' + tabId).classList.add('active');
            btnElement.classList.add('active');

            if(tabId === 'employees') {
                renderEmployeesTable();
            }
        }

        // ---------- ЛОГИКА ДАШБОРДА ----------
        function setDate(dayType) {
            document.getElementById('btn-today').classList.remove('active');
            document.getElementById('btn-yesterday').classList.remove('active');
            const dateInput = document.getElementById('date-select');
            let d = new Date();

            if (dayType === 'today') { document.getElementById('btn-today').classList.add('active'); }
            else if (dayType === 'yesterday') { document.getElementById('btn-yesterday').classList.add('active'); d.setDate(d.getDate() - 1); }

            dateInput.value = new Date(d.getTime() - (d.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            loadData();
        }

        function onCustomDateSelect() {
            document.getElementById('btn-today').classList.remove('active');
            document.getElementById('btn-yesterday').classList.remove('active');
            loadData();
        }

        function loadData() {
            const selectedDate = document.getElementById('date-select').value;
            const empId = document.getElementById('emp-select').value;
            let extraParam = empId ? `&employee_id=${empId}` : '';

            fetchSummary(selectedDate, extraParam);
            fetchDialogs(selectedDate, extraParam);
        }

        async function fetchSummary(dateStr, extraParam) {
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/admin/summary?target_date=${dateStr}&club_id=${clubId}${extraParam}`);
                const data = await res.json();
                document.getElementById('val-total').innerText = data.total_dialogs || 0;
                const negVal = document.getElementById('val-negative');
                negVal.innerText = (data.negative_share_percent || 0) + '%';
                negVal.className = data.negative_share_percent > 0 ? 'card-value val-red' : 'card-value';
            } catch (e) { console.error(e); }
        }

        async function fetchDialogs(dateStr, extraParam) {
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/admin/dialogs?target_date=${dateStr}&club_id=${clubId}${extraParam}`);
                currentDialogs = await res.json();
                renderTable();
            } catch (e) { console.error(e); }
        }

        function renderTable() {
            const tbody = document.getElementById('dialogs-tbody');
            const showOnlyViolations = document.getElementById('filter-violations').checked;
            tbody.innerHTML = "";

            let dataToRender = currentDialogs;
            if (showOnlyViolations) dataToRender = currentDialogs.filter(d => d.tonality === 'negative');

            if (dataToRender.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">Нет данных</td></tr>`;
                return;
            }

            dataToRender.forEach(d => {
                const tr = document.createElement('tr');
                const isNegative = d.tonality === 'negative';
                const statusBadge = isNegative ? `<span class="badge badge-danger">Нарушение</span>` : `<span class="badge badge-success">Ок</span>`;

                let violationsHtml = '';
                if (d.violations && d.violations.length > 0) {
                    violationsHtml = '<br>' + d.violations.map(v => `<span class="violation-tag">${v}</span>`).join('');
                }

                tr.innerHTML = `
                    <td style="font-weight: 600;">${d.employee}</td>
                    <td style="color: var(--text-muted);">${d.time}</td>
                    <td>${statusBadge}</td>
                    <td style="max-width: 400px; line-height: 1.5;">${d.transcript} ${violationsHtml}</td>
                    <td>${d.audio_url ? `<audio controls src="${d.audio_url}"></audio>` : '<span style="color: var(--text-muted); font-size: 13px;">Нет файла</span>'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ---------- ЛОГИКА СОТРУДНИКОВ ----------
        let employeesList = [];

        async function fetchEmployees() {
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/admin/employees?club_id=${clubId}`);
                employeesList = await res.json();

                // Обновляем фильтр в Дашборде
                const select = document.getElementById('emp-select');
                select.innerHTML = `<option value="">Все администраторы</option>`;
                employeesList.forEach(e => {
                    select.innerHTML += `<option value="${e.id}">${e.name}</option>`;
                });
            } catch (e) { console.error(e); }
        }

        function renderEmployeesTable() {
            const tbody = document.getElementById('emp-tbody');
            tbody.innerHTML = "";
            employeesList.forEach(e => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color: var(--text-muted); font-weight: bold;">#${e.id}</td>
                        <td style="font-weight: 600;">${e.name}</td>
                        <td><button class="btn-delete" onclick="deleteEmployee(${e.id})">Удалить</button></td>
                    </tr>
                `;
            });
        }

        async function addEmployee() {
            const nameInput = document.getElementById('new-emp-name');
            const name = nameInput.value.trim();
            if(!name) return alert("Введите имя сотрудника");

            try {
                await fetch(`http://127.0.0.1:8000/api/v1/admin/employees`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                nameInput.value = '';
                await fetchEmployees();
                renderEmployeesTable();
            } catch (e) { alert("Ошибка добавления"); }
        }

        async function deleteEmployee(id) {
            if(!confirm("Уверены, что хотите удалить сотрудника?")) return;
            try {
                await fetch(`http://127.0.0.1:8000/api/v1/admin/employees/${id}`, { method: 'DELETE' });
                await fetchEmployees();
                renderEmployeesTable();
                loadData(); // Перезагружаем дашборд, чтобы обновить фильтры
            } catch (e) { alert("Ошибка удаления"); }
        }
    </script>
</body>
</html>
